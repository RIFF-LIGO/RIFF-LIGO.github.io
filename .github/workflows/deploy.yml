# 说明：本工作流在 `master` 分支推送时触发，构建并部署 Hexo 博客到 GitHub Pages
# 参考：GitHub Actions https://docs.github.com/actions 与 GitHub Pages https://docs.github.com/pages
name: Hexo Blog CI/CD

on:
  # 触发器：当向 `master` 分支 push 时运行
  push:
    branches:
      - master # default branch

jobs:
  # 定义两个作业：
  # 1) build：构建并产出静态资源
  # 2) deploy：将产物发布到 GitHub Pages
  build:
    runs-on: ubuntu-latest
    steps:
      # 检出仓库代码（包含子模块）
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # If your repository depends on submodule, please see: https://github.com/actions/checkout
          submodules: recursive
      # 设置 Node.js 版本（使用 20）
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          # Examples: 20, 18.19, >=16.20.2, lts/Iron, lts/Hydrogen, *, latest, current, node
          # Ref: https://github.com/actions/setup-node#supported-version-syntax
          node-version: "20"
      # 缓存 NPM 依赖以提升后续构建速度
      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache
          restore-keys: |
            ${{ runner.OS }}-npm-cache
      # 安装项目依赖
      - name: Install Dependencies
        run: npm install
      # 构建 Hexo，生成静态站点到 ./public
      - name: Build
        run: npm run ci-build
      # 上传构建产物供 Pages 部署使用
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    # 赋予发布到 Pages 所需的权限
    permissions:
      pages: write
      id-token: write
    # 部署环境配置：名称和最终页面 URL 输出
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 将上一步上传的产物发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4